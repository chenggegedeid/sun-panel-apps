<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>音乐 · 商店图</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow: hidden; }
      body {
        width: 1020px;
        height: 765px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .stage { position: relative; width: 1020px; height: 765px; overflow: hidden; }
      .wall {
        position: absolute; inset: 0;
        background:
          radial-gradient(760px 520px at 12% 8%, rgba(56, 189, 248, 0.42), transparent 60%),
          radial-gradient(700px 560px at 88% 22%, rgba(244, 63, 94, 0.4), transparent 62%),
          radial-gradient(700px 600px at 50% 105%, rgba(139, 92, 246, 0.34), transparent 64%),
          linear-gradient(150deg, #0b1220, #1b2434 52%, #2b3444);
      }
      .wall.dark {
        background:
          radial-gradient(700px 480px at 78% 14%, rgba(244, 63, 94, 0.22), transparent 60%),
          radial-gradient(680px 520px at 16% 84%, rgba(59, 130, 246, 0.2), transparent 62%),
          linear-gradient(160deg, #08090d, #14161c 60%, #1d2027);
      }
      .wall.light {
        background:
          radial-gradient(700px 500px at 16% 12%, rgba(251, 207, 232, 0.9), transparent 62%),
          radial-gradient(680px 520px at 86% 78%, rgba(191, 219, 254, 0.95), transparent 64%),
          linear-gradient(160deg, #f8fafc, #eef2ff);
      }
      .brand { position: absolute; left: 46px; top: 40px; z-index: 3; }
      .brand h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
      .brand p { margin: 9px 0 0; font-size: 13.5px; line-height: 1.6; color: rgba(255, 255, 255, 0.62); max-width: 470px; }
      .brand.ink h1 { color: #0f172a; }
      .brand.ink p { color: rgba(15, 23, 42, 0.6); }
      .shot { position: absolute; }
      .s2 { left: 46px; top: 400px; }
      .s3 { left: 500px; top: 400px; }
      .s4 { left: 46px; top: 600px; }
      .win {
        position: absolute; overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 26px 60px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .full { position: absolute; inset: 0; }
      .cap {
        position: absolute; left: 46px; bottom: 36px; z-index: 4;
        font-size: 12px; color: rgba(255, 255, 255, 0.5);
      }
      .cap b { color: rgba(255, 255, 255, 0.86); font-weight: 600; }
      .vignette {
        position: absolute; inset: 0; z-index: 1;
        background: radial-gradient(120% 95% at 50% 40%, transparent 46%, rgba(3, 7, 18, 0.4) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>

    <script type="module">
      import { MusicWidget } from './src/components/widget.js';
      import { MusicMain } from './src/components/mainPage.js';
      import { player } from './src/utils/player.js';

      const SHOT = new URLSearchParams(location.search).get('shot') || '1';
      const ORIGIN = location.origin;

      const server = { id: 'demo', name: '家里的音乐', url: `${ORIGIN}/mock`, user: 'demo', password: 'demo', default: true };

      const SONGS = {
        a1: [
          { id: 'a1-s1', title: 'Norman fucking Rockwell', artist: 'Lana Del Rey', album: 'Norman Fucking Rockwell!', albumId: 'a1', coverArt: 'a1', cover: 'a1', duration: 269 },
          { id: 'a1-s2', title: 'Mariners Apartment Complex', artist: 'Lana Del Rey', album: 'Norman Fucking Rockwell!', albumId: 'a1', coverArt: 'a1', cover: 'a1', duration: 246 },
          { id: 'a1-s3', title: 'Venice Bitch', artist: 'Lana Del Rey', album: 'Norman Fucking Rockwell!', albumId: 'a1', coverArt: 'a1', cover: 'a1', duration: 537 },
        ],
        a2: [
          { id: 'a2-s1', title: '富士山下', artist: '陈奕迅', album: '认了吧', albumId: 'a2', coverArt: 'a2', cover: 'a2', duration: 245 },
          { id: 'a2-s2', title: '好久不见', artist: '陈奕迅', album: '认了吧', albumId: 'a2', coverArt: 'a2', cover: 'a2', duration: 253 },
          { id: 'a2-s3', title: '不如不见', artist: '陈奕迅', album: '认了吧', albumId: 'a2', coverArt: 'a2', cover: 'a2', duration: 236 },
          { id: 'a2-s4', title: '白色球鞋', artist: '陈奕迅', album: '认了吧', albumId: 'a2', coverArt: 'a2', cover: 'a2', duration: 262 },
          { id: 'a2-s5', title: '淘汰', artist: '陈奕迅', album: '认了吧', albumId: 'a2', coverArt: 'a2', cover: 'a2', duration: 279 },
        ],
      };

      const queue = SONGS.a2;
      const current = queue[0];

      // 让卡片和窗口都进入“正在播放”状态，不需要真的解码音频
      player.snapshot = () => ({
        cur: current,
        playing: true,
        progress: 46.2,
        duration: current.duration,
        loading: false,
        error: '',
        queue,
        index: 0,
        server,
        lyricLine: '岁月在默数三四五六',
      });
      player.server = server;
      player.queue = queue;
      player.index = 0;

      const api = {
        // 预览环境用原生请求模拟宿主网络透传（仅开发用，不进构建产物）
        network: {
          request: async ({ request }) => {
            const r = await fetch(request.targetUrl, { headers: request.headers || {} });
            const text = await r.text();
            let data = text;
            try {
              data = JSON.parse(text);
            } catch {
              /* 非 JSON 原样返回 */
            }
            if (!r.ok) {
              const err = new Error('HTTP ' + r.status);
              err.response = { status: r.status, data };
              throw err;
            }
            return { data, status: r.status };
          },
        },
        timer: { setInterval: (f, m) => setInterval(f, m), clearInterval: (i) => clearInterval(i) },
        dataNode: {
          user: {
            getByKey: async (n, k) => (k === 'servers' ? [server] : k === 'activeId' ? 'demo' : k === 'settings' ? null : null),
            setByKey: async () => {},
          },
        },
        widget: { save: async () => {} },
        window: { open: () => {}, close: () => {} },
      };

      const ctx = (extra = {}) => ({ api, darkMode: true, language: 'zh-CN', networkMode: 'LAN', staticPath: '/', role: 2, ...extra });

      if (!customElements.get('s-widget')) customElements.define('s-widget', MusicWidget);
      if (!customElements.get('s-main')) customElements.define('s-main', MusicMain);

      const stage = document.getElementById('stage');
      const el = (tag, cls, css) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (css) n.style.cssText = css;
        return n;
      };

      function widget(size, w, h, cfg = {}, dark = true) {
        const box = el('div', 'shot', `width:${w}px;height:${h}px`);
        const node = document.createElement('s-widget');
        node.style.cssText = 'display:block;height:100%;';
        node.spCtx = ctx({
          darkMode: dark,
          widgetInfo: {
            widgetId: 'w-' + size + Math.random(),
            config: { bgMode: 'transparent', textColor: '#f7f7fa', accent: '#f43f5e', showName: true, showStatus: true, ...cfg },
            gridSize: size,
            background: 'transparent',
            title: '',
          },
        });
        box.appendChild(node);
        return box;
      }

      function mainPage(w, h, opts = {}) {
        const win = el('div', 'win', `left:${opts.left || 0}px;top:${opts.top || 0}px;width:${w}px;height:${h}px`);
        const node = document.createElement('s-main');
        node.style.cssText = 'display:block;height:100%;';
        node.spCtx = ctx({ customParam: { serverId: 'demo' } });
        win.appendChild(node);
        return { win, node };
      }

      // ---------- 各张图 ----------
      function shot1() {
        stage.innerHTML = '';
        stage.appendChild(el('div', 'wall'));
        stage.appendChild(el('div', 'vignette'));

        const b = el('div', 'brand');
        b.innerHTML = `<h1>音乐</h1><p>把自建音乐库放进导航页<br/>卡片上就能播放、切歌，点开是完整的专辑墙与同步歌词</p>`;
        stage.appendChild(b);

        const glass = { bgMode: 'frosted', bgColor: '#ffffff', bgOpacity: 17, textMode: 'light', radius: 16 };

        const c1 = widget('2x4', 448, 224, glass);
        c1.style.cssText += 'left:46px;top:250px;';
        const c2 = widget('2x2', 250, 250, glass);
        c2.style.cssText += 'left:516px;top:250px;';
        const c3 = widget('1x1', 112, 112, glass);
        c3.style.cssText += 'left:790px;top:250px;';
        const c4 = widget('1xfull', 928, 112, glass);
        c4.style.cssText += 'left:46px;top:514px;';
        stage.append(c1, c2, c3, c4);

        const cap = el('div', 'cap');
        cap.innerHTML = `<b>7 种尺寸</b> · 透明 / 毛玻璃 / 纯色 · 深浅色自适应`;
        stage.appendChild(cap);
      }

      function shot2() {
        stage.innerHTML = '';
        stage.appendChild(el('div', 'wall', 'filter:saturate(0.9)'));
        stage.appendChild(el('div', 'vignette'));
        const b = el('div', 'brand');
        b.innerHTML = `<h1>专辑墙</h1><p>最新 / 最近播放 / 最常听 / 按名称排序，点开任意一张进专辑</p>`;
        stage.appendChild(b);
        const { win } = mainPage(928, 500, { left: 46, top: 220 });
        stage.appendChild(win);
      }

      function shot3() {
        stage.innerHTML = '';
        stage.appendChild(el('div', 'wall'));
        stage.appendChild(el('div', 'vignette'));
        const b = el('div', 'brand');
        b.innerHTML = `<h1>歌词跟着唱</h1><p>逐行高亮、自动居中；点任意一行跳到那句</p>`;
        stage.appendChild(b);
        const { win, node } = mainPage(928, 520, { left: 46, top: 200 });
        stage.appendChild(win);
        setTimeout(async () => {
          try {
            await node._openAlbum('a2');
            setTimeout(() => {
              node._playFrom(SONGS.a2, 0);
              node._toggleLyrics();
            }, 120);
          } catch (e) {
            console.error(e);
          }
        }, 700);
      }

      function shot4() {
        stage.innerHTML = '';
        stage.appendChild(el('div', 'wall'));
        stage.appendChild(el('div', 'vignette'));
        const b = el('div', 'brand');
        b.innerHTML = `<h1>三种背景</h1><p>完全透明 / 毛玻璃 / 纯色，颜色、不透明度、圆角都能调</p>`;
        stage.appendChild(b);

        const items = [
          ['完全透明', { bgMode: 'transparent', textMode: 'light' }],
          ['毛玻璃', { bgMode: 'frosted', bgColor: '#ffffff', bgOpacity: 17, textMode: 'light' }],
          ['纯色', { bgMode: 'solid', bgColor: '#232c42', bgOpacity: 100, textMode: 'light' }],
        ];

        items.forEach(([label, cfg], i) => {
          const left = 46 + i * 314;
          const wrap = el('div', 'shot', `left:${left}px;top:270px;`);
          const t = el('div', '', 'font-size:12.5px;color:rgba(255,255,255,.62);margin-bottom:10px;letter-spacing:.02em;');
          t.textContent = label;
          const c = widget('2x2', 250, 250, { ...cfg, radius: 16 });
          c.style.left = '0';
          c.style.top = '0';
          c.style.position = 'relative';
          wrap.append(t, c);
          stage.appendChild(wrap);
        });

        const cap = el('div', 'cap');
        cap.innerHTML = `<b>深浅色自适应</b> · 文字颜色可跟随主题或自定义`;
        stage.appendChild(cap);
      }

      const scenes = { '1': shot1, '2': shot2, '3': shot3, '4': shot4 };
      (scenes[SHOT] || shot1)();
    </script>
  </body>
</html>
