<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日历倒计时 · 手机宽度预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background:
          radial-gradient(600px 400px at 10% 10%, rgba(56, 189, 248, 0.7), transparent 60%),
          radial-gradient(600px 500px at 90% 30%, rgba(167, 139, 250, 0.6), transparent 62%),
          linear-gradient(150deg, #0b1220, #1e293b 55%, #334155);
        min-height: 100vh;
      }
      h2 { font-size: 12px; color: #fff; font-weight: 500; margin: 18px 0 8px; opacity: 0.85; }
      .phone { width: 390px; max-width: 100%; }
      .ph2 { width: 320px; max-width: 100%; }
      .card { border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
      .label { font-size: 10px; color: rgba(255, 255, 255, 0.5); margin-bottom: 3px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { Widget } from './src/components/widget.js';

      const EVENTS = [
        { id: '1', title: '我的生日', date: '1996-05-02', type: 'birthday', yearly: true, emoji: '🎂' },
        { id: '2', title: '结婚纪念日', date: '2023-10-20', type: 'anniversary', yearly: true, emoji: '💗' },
        { id: '3', title: '妈妈生日', date: '1968-03-12', type: 'birthday', yearly: true, emoji: '🎂' },
        { id: '4', title: '项目上线', date: '2026-12-15', type: 'reminder', yearly: false, emoji: '📌' },
      ];

      const api = {
        timer: { setInterval: (f, m) => setInterval(f, m), clearInterval: (i) => clearInterval(i) },
        dataNode: { user: { getByKey: async () => EVENTS, setByKey: async () => {} } },
        widget: { save: async () => {} },
        window: { open: () => {}, close: () => {} },
      };

      if (!customElements.get('cal-widget')) customElements.define('cal-widget', Widget);

      const mount = (parent, w, size, h, darkMode = true) => {
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${size} · ${w}px`;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.width = w + 'px';
        card.style.height = h + 'px';
        const el = document.createElement('cal-widget');
        el.style.cssText = 'display:block;height:100%;';
        el.spCtx = {
          api, darkMode, language: 'zh-CN', staticPath: '/',
          widgetInfo: {
            widgetId: 'm' + size + w,
            config: { bgMode: 'transparent', textMode: 'auto', accent: '#38bdf8', showLunar: true, textShadow: true },
            gridSize: size,
            background: 'transparent',
          },
        };
        card.appendChild(el);
        parent.append(label, card);
      };

      const app = document.getElementById('app');
      const phone = document.createElement('div');
      phone.className = 'phone';
      const small = document.createElement('div');
      small.className = 'ph2';

      const t1 = document.createElement('h2');
      t1.textContent = '390px（iPhone 宽度）';
      const t2 = document.createElement('h2');
      t2.textContent = '320px（小屏）';

      app.append(t1, phone, t2, small);

      mount(phone, 390, '1xfull', 96);
      mount(phone, 390, '2x2', 200);
      mount(phone, 390, '2x4', 260);
      mount(phone, 390, '2x1', 96);
      mount(phone, 110, '1x1', 110);
      mount(phone, 96, '1x1', 96);
      mount(phone, 96, '1x2', 200);

      mount(small, 320, '1xfull', 96);
      mount(small, 320, '2x1', 96);
    </script>
  </body>
</html>
