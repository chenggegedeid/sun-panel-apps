<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>应用图集生成</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1020px; height: 765px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #0b1220;
        color: #fff;
      }
      .stage {
        position: relative;
        width: 1020px;
        height: 765px;
        overflow: hidden;
      }
      .bg-a {
        background:
          radial-gradient(760px 460px at 12% 8%, rgba(56, 189, 248, 0.55), transparent 62%),
          radial-gradient(680px 520px at 88% 14%, rgba(167, 139, 250, 0.5), transparent 64%),
          radial-gradient(800px 600px at 72% 96%, rgba(251, 146, 60, 0.42), transparent 62%),
          radial-gradient(560px 480px at 16% 92%, rgba(16, 185, 129, 0.38), transparent 64%),
          linear-gradient(150deg, #0a1020 0%, #16203a 42%, #24304d 100%);
      }
      .bg-b {
        background:
          radial-gradient(700px 420px at 78% 6%, rgba(236, 72, 153, 0.42), transparent 60%),
          radial-gradient(720px 480px at 6% 26%, rgba(59, 130, 246, 0.5), transparent 62%),
          radial-gradient(760px 560px at 52% 100%, rgba(45, 212, 191, 0.34), transparent 64%),
          linear-gradient(160deg, #0c1424 0%, #1b2540 48%, #2b2a4a 100%);
      }
      .bg-c {
        background:
          radial-gradient(520px 400px at 46% 56%, rgba(251, 146, 60, 0.95), transparent 68%),
          radial-gradient(440px 340px at 80% 44%, rgba(236, 72, 153, 0.85), transparent 66%),
          radial-gradient(480px 380px at 12% 38%, rgba(56, 189, 248, 0.92), transparent 68%),
          linear-gradient(160deg, #0d1526 0%, #1c2742 55%, #2a2440 100%);
      }
      .bg-c::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 236px;
        height: 372px;
        z-index: 1;
        background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1.2px, transparent 1.2px);
        background-size: 13px 13px;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
        mask-image: linear-gradient(180deg, transparent 0%, #000 20%, #000 80%, transparent 100%);
        pointer-events: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 42%, transparent 42%, rgba(3, 7, 18, 0.42) 100%);
        pointer-events: none;
        z-index: 1;
      }
      .slot { position: absolute; z-index: 2; }
      .brand,
      .cap,
      .headline { z-index: 3; }

      .brand {
        position: absolute;
        left: 44px;
        top: 38px;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .brand img {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      }
      .brand .t { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
      .brand .s { font-size: 11px; color: rgba(255, 255, 255, 0.55); margin-top: 2px; }

      .cap {
        position: absolute;
        left: 44px;
        bottom: 40px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
        display: flex;
        align-items: center;
        gap: 9px;
        letter-spacing: 0.01em;
      }
      .headline {
        position: absolute;
        left: 44px;
        top: 104px;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.95);
      }
      .cap::before {
        content: '';
        width: 22px;
        height: 2px;
        border-radius: 2px;
        background: #38bdf8;
      }

      .slot { position: absolute; }
      .slot .name {
        position: absolute;
        left: 0;
        top: -22px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.06em;
      }
      .card {
        width: 100%;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
      }
      .shot { display: none; }
      .shot.on { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import { Widget } from './src/components/widget.js';

      const EVENTS = [
        { id: '1', title: '我的生日', date: '1996-05-02', type: 'birthday', yearly: true, emoji: '🎂' },
        { id: '2', title: '结婚纪念日', date: '2023-10-20', type: 'anniversary', yearly: true, emoji: '💗' },
        { id: '3', title: '妈妈生日', date: '1968-03-12', type: 'birthday', yearly: true, emoji: '🎂' },
        { id: '4', title: '项目上线', date: '2026-12-15', type: 'reminder', yearly: false, emoji: '📌' },
      ];

      const api = {
        timer: { setInterval: (f, m) => setInterval(f, m), clearInterval: (i) => clearInterval(i) },
        dataNode: { user: { getByKey: async () => EVENTS, setByKey: async () => {} } },
        widget: { save: async () => {} },
        window: { open: () => {}, close: () => {} },
      };

      if (!customElements.get('cal-widget')) customElements.define('cal-widget', Widget);

      const base = { showLunar: true, textShadow: true, accent: '#38bdf8' };

      const mount = (parent, { x, y, w, h, size, cfg = {}, dark = false, label }) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        Object.assign(slot.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
        if (label) {
          const n = document.createElement('div');
          n.className = 'name';
          n.textContent = label;
          slot.appendChild(n);
        }
        const card = document.createElement('div');
        card.className = 'card';
        const el = document.createElement('cal-widget');
        el.style.cssText = 'display:block;height:100%;width:100%;';
        el.spCtx = {
          api,
          darkMode: dark,
          language: 'zh-CN',
          staticPath: '/',
          widgetInfo: {
            widgetId: 'shot-' + Math.random().toString(36).slice(2, 7),
            config: { ...base, ...cfg },
            gridSize: size,
            background: 'transparent',
          },
        };
        card.appendChild(el);
        slot.appendChild(card);
        parent.appendChild(slot);
      };

      const brand = (stage, sub = '透明背景 · 农历节气 · 纪念日倒计时') => {
        const b = document.createElement('div');
        b.className = 'brand';
        b.innerHTML = `<img src="/icon.png" alt="" /><div><div class="t">日历倒计时</div><div class="s">${sub}</div></div>`;
        stage.appendChild(b);
      };

      const caption = (stage, text) => {
        const c = document.createElement('div');
        c.className = 'cap';
        c.textContent = text;
        stage.appendChild(c);
      };

      const headline = (stage, text) => {
        const h = document.createElement('div');
        h.className = 'headline';
        h.textContent = text;
        stage.appendChild(h);
      };

      const shot1 = () => {
        const s = document.createElement('div');
        s.className = 'stage bg-a';
        brand(s);
        headline(s, '把生日、纪念日和节日，放进你的导航页');
        mount(s, { x: 60, y: 210, w: 900, h: 118, size: '1xfull', cfg: { textMode: 'light' } });
        mount(s, { x: 60, y: 356, w: 420, h: 300, size: '2x4', cfg: { textMode: 'light' } });
        mount(s, { x: 510, y: 356, w: 220, h: 220, size: '2x2', cfg: { textMode: 'light' } });
        mount(s, { x: 760, y: 356, w: 110, h: 110, size: '1x1', cfg: { textMode: 'light' } });
        mount(s, { x: 760, y: 486, w: 210, h: 110, size: '2x1', cfg: { textMode: 'light' } });
        mount(s, { x: 510, y: 592, w: 460, h: 96, size: '1xfull', cfg: { textMode: 'light' } });
        caption(s, '完全透明：不画任何底色，直接融进你的壁纸');
        const v = document.createElement('div');
        v.className = 'vignette';
        s.appendChild(v);
        return s;
      };

      const shot2 = () => {
        const s = document.createElement('div');
        s.className = 'stage bg-b';
        brand(s, '月历 · 农历 · 节气 · 节日');
        headline(s, '月历上直接标出农历与节气');
        mount(s, { x: 60, y: 232, w: 440, h: 300, size: '2x4', cfg: { textMode: 'light' } });
        mount(s, { x: 520, y: 232, w: 220, h: 220, size: '2x2', cfg: { textMode: 'light' } });
        mount(s, { x: 760, y: 232, w: 210, h: 110, size: '2x1', cfg: { textMode: 'light' } });
        mount(s, { x: 760, y: 362, w: 110, h: 110, size: '1x1', cfg: { textMode: 'light' } });
        mount(s, { x: 520, y: 486, w: 450, h: 96, size: '1xfull', cfg: { textMode: 'light' } });
        caption(s, '倒计时按剩余天数自动排序，越近越靠前');
        const v = document.createElement('div');
        v.className = 'vignette';
        s.appendChild(v);
        return s;
      };

      const shot3 = () => {
        const s = document.createElement('div');
        s.className = 'stage bg-c';
        brand(s, '三种背景 · 一根开关切换');
        headline(s, '透明、毛玻璃、纯色，随壁纸怎么好看怎么来');
        mount(s, { x: 90, y: 300, w: 250, h: 250, size: '2x2', cfg: { textMode: 'light' }, label: '完全透明' });
        mount(s, { x: 385, y: 300, w: 250, h: 250, size: '2x2', cfg: { bgMode: 'frosted', bgColor: '#0b1220', bgOpacity: 32, textMode: 'light' }, label: '毛玻璃' });
        mount(s, { x: 680, y: 300, w: 250, h: 250, size: '2x2', cfg: { bgMode: 'solid', bgColor: '#0b1220', bgOpacity: 74, textMode: 'light' }, label: '纯色 74%' });
        caption(s, '透明度 0–100% 连续可调，文字可跟随深浅色');
        const v = document.createElement('div');
        v.className = 'vignette';
        s.appendChild(v);
        return s;
      };

      const shot4 = () => {
        const s = document.createElement('div');
        s.className = 'stage bg-b';
        brand(s, '深色模式 · 七种尺寸');
        headline(s, '深色模式自动跟随，1x1 到 1xfull 七种尺寸');
        mount(s, { x: 60, y: 236, w: 420, h: 420, size: '4x4', cfg: { textMode: 'auto' }, dark: true });
        mount(s, { x: 520, y: 236, w: 460, h: 96, size: '1xfull', cfg: { textMode: 'auto' }, dark: true });
        mount(s, { x: 520, y: 356, w: 110, h: 110, size: '1x1', cfg: { textMode: 'auto' }, dark: true });
        mount(s, { x: 650, y: 356, w: 330, h: 110, size: '2x1', cfg: { textMode: 'auto' }, dark: true });
        mount(s, { x: 520, y: 490, w: 460, h: 230, size: '2x4', cfg: { textMode: 'auto' }, dark: true });
        caption(s, '长按右键即可配置，事件存本地面板账号');
        const v = document.createElement('div');
        v.className = 'vignette';
        s.appendChild(v);
        return s;
      };

      const shots = { 1: shot1, 2: shot2, 3: shot3, 4: shot4 };
      const n = Number(new URLSearchParams(location.search).get('shot') || 1);
      document.getElementById('app').appendChild((shots[n] || shot1)());
    </script>
  </body>
</html>
